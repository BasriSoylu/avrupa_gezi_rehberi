<style>
:root{
  --ink:#0E1F33;
  --ink-soft:#3E546B;
  --paper:#E7EAEE;
  --card:#FFFFFF;
  --rule:#C9D2DB;
  --stamp:#C8102E;
  --transit:#2E5E8C;
  --done:#1B7A5A;
  --mono:ui-monospace,"SF Mono","Cascadia Mono","Roboto Mono",Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--sans);
  font-size:15px;
  line-height:1.5;
  padding:0 0 64px;
  background-image:repeating-linear-gradient(0deg,transparent 0 39px,rgba(14,31,51,.035) 39px 40px);
}

/* ---------- Üst bilgi ---------- */
.masthead{
  background:var(--ink);
  color:#fff;
  padding:18px 16px 14px;
  padding-top:calc(18px + env(safe-area-inset-top));
}
.route{
  font-family:var(--mono);
  font-size:22px;
  letter-spacing:.14em;
  font-weight:700;
  display:flex;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
}
.route .arw{color:#7FA6C9;font-weight:400}
.subline{
  font-family:var(--mono);
  font-size:11px;
  letter-spacing:.18em;
  color:#9FB6CB;
  margin-top:6px;
  text-transform:uppercase;
}
.meter{margin-top:14px}
.meter-bar{
  height:5px;
  background:rgba(255,255,255,.16);
  border-radius:0;
  overflow:hidden;
}
.meter-fill{
  height:100%;
  width:0;
  background:#7FC9A8;
  transition:width .35s ease;
}
.meter-txt{
  font-family:var(--mono);
  font-size:11px;
  letter-spacing:.1em;
  color:#9FB6CB;
  margin-top:6px;
  display:flex;
  justify-content:space-between;
}

/* ---------- Gün sekmeleri ---------- */
.daystrip{
  position:sticky;top:0;z-index:20;
  background:var(--ink);
  border-top:1px solid rgba(255,255,255,.12);
  display:flex;
  gap:0;
  overflow-x:auto;
  scrollbar-width:none;
  padding:0 4px;
}
.daystrip::-webkit-scrollbar{display:none}
.daytab{
  flex:0 0 auto;
  background:none;border:none;
  color:#8AA3BA;
  font-family:var(--mono);
  padding:10px 13px 9px;
  cursor:pointer;
  text-align:center;
  border-bottom:3px solid transparent;
  transition:color .15s;
}
.daytab b{display:block;font-size:15px;letter-spacing:.04em;font-weight:700}
.daytab span{display:block;font-size:9px;letter-spacing:.14em;margin-top:1px}
.daytab.on{color:#fff;border-bottom-color:var(--stamp)}
.daytab.full{color:#7FC9A8}
.daytab.full.on{color:#7FC9A8;border-bottom-color:#7FC9A8}
.daytab:focus-visible{outline:2px solid #7FA6C9;outline-offset:-2px}

/* ---------- Bilet kartı ---------- */
.wrap{max-width:720px;margin:0 auto;padding:18px 12px 0}
.ticket{
  background:var(--card);
  border:1px solid var(--rule);
  position:relative;
  box-shadow:0 1px 0 rgba(14,31,51,.06);
}
.ticket-head{
  display:flex;
  align-items:stretch;
  border-bottom:1px dashed var(--rule);
}
.stub{
  flex:0 0 62px;
  background:var(--ink);
  color:#fff;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:14px 4px;
  position:relative;
}
.stub .d{font-family:var(--mono);font-size:27px;font-weight:700;line-height:1}
.stub .m{font-family:var(--mono);font-size:9px;letter-spacing:.16em;margin-top:3px;color:#9FB6CB}
.head-body{flex:1;padding:14px 15px;min-width:0}
.eyebrow{
  font-family:var(--mono);
  font-size:10px;
  letter-spacing:.2em;
  color:var(--transit);
  text-transform:uppercase;
}
.title{
  font-size:20px;
  font-weight:700;
  letter-spacing:-.01em;
  margin:3px 0 0;
  line-height:1.2;
}
.leg{
  font-family:var(--mono);
  font-size:12px;
  letter-spacing:.06em;
  color:var(--ink-soft);
  margin-top:7px;
}
.leg .hl{color:var(--stamp);font-weight:700}
.daymeter{
  font-family:var(--mono);
  font-size:10px;
  letter-spacing:.1em;
  color:var(--ink-soft);
  margin-top:9px;
  display:flex;align-items:center;gap:8px;
}
.daymeter .track{flex:1;height:3px;background:var(--rule)}
.daymeter .fill{height:100%;width:0;background:var(--done);transition:width .3s ease}

/* tamamlandı damgası */
.stamp{
  position:absolute;
  top:12px;right:12px;
  border:2.5px solid var(--done);
  color:var(--done);
  font-family:var(--mono);
  font-size:11px;
  letter-spacing:.16em;
  font-weight:700;
  padding:5px 9px;
  transform:rotate(-11deg) scale(.7);
  opacity:0;
  pointer-events:none;
  transition:opacity .25s ease,transform .25s cubic-bezier(.2,1.5,.4,1);
  background:rgba(255,255,255,.9);
}
.ticket.done .stamp{opacity:1;transform:rotate(-11deg) scale(1)}

/* ---------- Bölümler & maddeler ---------- */
.group{border-top:1px solid var(--rule)}
.group:first-of-type{border-top:none}
.group-h{
  font-family:var(--mono);
  font-size:10px;
  letter-spacing:.2em;
  text-transform:uppercase;
  color:var(--ink-soft);
  padding:12px 15px 6px;
  display:flex;align-items:center;gap:8px;
}
.group-h::after{content:"";flex:1;height:1px;background:var(--rule)}

.item{
  display:flex;
  align-items:center;
  gap:12px;
  padding:14px 15px;
  cursor:pointer;
  border-top:1px solid #F0F3F6;
}
.item:first-of-type{border-top:none}
.item:active{background:#F7F9FB}

/* --- KUTULAR BÜYÜTÜLDÜ --- */
.box{
  flex:0 0 26px; height:26px;
  border:2px solid var(--ink-soft);
  border-radius:5px;
  display:grid;place-items:center;
  transition:background .12s,border-color .12s;
}
.box svg{width:15px;height:15px;stroke:#fff;stroke-width:3;fill:none;
  stroke-dasharray:20;stroke-dashoffset:20;transition:stroke-dashoffset .18s ease}
.item.on .box{background:var(--done);border-color:var(--done)}
.item.on .box svg{stroke-dashoffset:0}
.txt{flex:1;min-width:0; font-size:16px;}
.item.on .txt{color:#8B98A5;text-decoration:line-through;text-decoration-color:#C3CCD5}
.tag{
  display:inline-block;
  font-family:var(--mono);
  font-size:9px;letter-spacing:.12em;
  padding:2px 5px;margin-right:6px;
  vertical-align:2px;
  border:1px solid currentColor;
}
.tag.krit{color:var(--stamp)}
.tag.taslak{color:var(--transit)}
.item:focus-visible{outline:2px solid var(--transit);outline-offset:-2px}

/* ---------- Not kutusu ---------- */
.memo{
  margin:0 15px 13px;
  border-left:3px solid var(--stamp);
  background:#FBF3F4;
  padding:9px 11px;
  font-size:13px;
  color:var(--ink);
}
.memo b{font-family:var(--mono);font-size:10px;letter-spacing:.14em;display:block;color:var(--stamp);margin-bottom:2px}

/* ---------- POP-UP (MODAL) TASARIMI ---------- */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(14, 31, 51, 0.6);
  z-index: 100; display: none; align-items: flex-end; justify-content: center;
  opacity: 0; transition: opacity 0.25s ease;
}
.modal-overlay.show { display: flex; opacity: 1; }
.modal-card {
  background: #fff; width: 100%; max-width: 500px;
  border-radius: 16px 16px 0 0; padding: 24px;
  transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.2, 1, 0.3, 1);
  box-shadow: 0 -10px 25px rgba(0,0,0,0.1);
}
.modal-overlay.show .modal-card { transform: translateY(0); }
@media(min-width:640px) {
  .modal-overlay { align-items: center; }
  .modal-card { border-radius: 12px; transform: scale(0.95); }
  .modal-overlay.show .modal-card { transform: scale(1); }
}
.modal-title { font-size: 19px; font-weight: 700; color: var(--ink); margin: 0 0 10px; line-height: 1.3; }
.modal-hint { font-size: 15px; color: var(--ink-soft); margin-bottom: 24px; line-height: 1.5; }
.modal-hint b { color: var(--ink); }
.modal-btn {
  display: block; width: 100%; padding: 16px;
  font-size: 15px; font-weight: 700; color: #fff; letter-spacing: 0.05em;
  background: var(--done); border: none; border-radius: 8px; cursor: pointer;
  margin-bottom: 10px;
}
.modal-btn.is-done { background: var(--ink-soft); }
.modal-close {
  display: block; width: 100%; padding: 12px; background: none; border: none;
  font-size: 13px; font-weight: 600; color: var(--ink-soft); cursor: pointer;
}

/* ---------- Alt bar ---------- */
.tools{
  max-width:720px;margin:16px auto 0;padding:0 12px;
  display:flex;gap:8px;flex-wrap:wrap;
}
.tools button{
  font-family:var(--mono);
  font-size:11px;letter-spacing:.1em;
  background:none;border:1px solid var(--rule);
  color:var(--ink-soft);
  padding:8px 11px;cursor:pointer;
}
.tools button:hover{border-color:var(--ink-soft);color:var(--ink)}
.tools button:focus-visible{outline:2px solid var(--transit);outline-offset:1px}
.tools .danger:hover{border-color:var(--stamp);color:var(--stamp)}
.tools .refresh-btn{border-color:var(--done);color:var(--done)}
.tools .refresh-btn:hover{background:var(--done);color:#fff}

.warn{
  max-width:720px;margin:12px auto 0;padding:9px 12px;
  font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;
  color:#8a6d00;background:#FFF6DC;border:1px solid #F0DFA8;
  display:none;
}
.foot{
  max-width:720px;margin:22px auto 0;padding:0 12px;
  font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:#9AA7B4;
}
</style>

},
{
  d:"25", m:"AĞU", wd:"SALI", eyebrow:"Adım 3", title:"Dönüş günü",
  leg:"FCO 14:50 → İSTANBUL · <span class='hl'>09:00'DA YOLA ÇIK</span>",
  memo:"Tax Free onayı check-in'den ÖNCE yapılır. Ürünleri valize verirsen gümrük göremez, iade iptal olur.",
  groups:[
    { h:"Sabah", items:[
      {t:"Hostel çıkışı — 11:00'e kadar, ama erken çık"},
      {t:"Dolabı boşalt, asma kilidi al"},
      {t:"09:00 civarı Fiumicino'ya hareket", tag:"krit", hint:"Normal 2 saat yerine 3 saat erken git — gümrük kuyruğu için."}
    ]},
    { h:"Fiumicino — Tax Free", items:[
      {t:"Check-in'den ÖNCE gümrük masasına git", tag:"krit"},
      {t:"Yanında: pasaport, DIVA formları, fişler, ürünler", tag:"krit", hint:"İspanyol formunu kiosk okumayabilir — personelli masaya git."},
      {t:"Ürünler kullanılmamış ve etiketli", tag:"krit"},
      {t:"İade yöntemini seç", hint:"Nakit anında ama komisyonu yüksek; karta iade 2–8 hafta sürüyor."}
    ]},
    { h:"Uçuş", items:[
      {t:"Bagaj ağırlığı kontrol"},
      {t:"Check-in / bagaj drop"},
      {t:"Pasaport kontrolü — Schengen çıkış damgası", tag:"krit", hint:"Damganın vurulduğundan emin ol, vize geçmişin için önemli."},
      {t:"Güvenlik ve gate"}

<header class="masthead">
  <div class="route">IST <span class="arw">→</span> BCN <span class="arw">→</span> FCO <span class="arw">→</span> IST</div>
  <div class="subline">19–25 Ağustos 2026 · Barselona &amp; Roma</div>
  <div class="meter">
    <div class="meter-bar"><div class="meter-fill" id="allFill"></div></div>
    <div class="meter-txt"><span id="allTxt">0 / 0</span><span id="allPct">%0</span></div>
  </div>
</header>

<nav class="daystrip" id="strip" aria-label="Günler"></nav>

<main class="wrap"><div id="stage"></div></main>

<div class="warn" id="warn"></div>

<div class="tools">
  <button id="btnExport">YEDEĞİ İNDİR</button>
  <button id="btnImport">YEDEK YÜKLE</button>
  <button id="btnRefresh" class="refresh-btn">SİTEYİ GÜNCELLE</button>
  <button id="btnReset" class="danger">SIFIRLA</button>
  <input type="file" id="fileIn" accept="application/json" hidden>
</div>

<p class="foot" id="foot">SÜRÜM 3 · 17 AĞUSTOS 2026</p>

<!-- POP-UP (MODAL) HTML -->
<div class="modal-overlay" id="itemModal">
  <div class="modal-card">
    <div id="modalTagWrap" style="margin-bottom:8px; display:none;"></div>
    <h3 class="modal-title" id="modalTitle">Başlık</h3>
    <div class="modal-hint" id="modalHint" style="display:none;">Açıklama</div>
    <button class="modal-btn" id="modalToggleBtn">TAMAMLA</button>
    <button class="modal-close" id="modalCloseBtn">KAPAT</button>
  </div>
</div>

<script>
(function(){
  const KEY = "gezi-2026-08";
  let state = {};
  let storageOK = true;

  /* --- Kalıcılık --- */
  function load(){
    try{
      const raw = localStorage.getItem(KEY);
      state = raw ? JSON.parse(raw) : {};
    }catch(e){
      storageOK = false; state = {};
      const w = document.getElementById("warn");
      w.textContent = "KAYIT KAPALI — Özel sekmede olabilirsiniz.";
      w.style.display = "block";
    }
  }
  function save(){
    if(!storageOK) return;
    try{ localStorage.setItem(KEY, JSON.stringify(state)); }
    catch(e){ storageOK = false; }
  }

  const idOf = (di,gi,ii) => di+"."+gi+"."+ii;
  const norm  = it => typeof it === "string" ? {t:it} : it;

  function counts(di){
    const day = PLAN[di]; let total=0, done=0;
    day.groups.forEach((g,gi)=>g.items.forEach((_,ii)=>{
      total++; if(state[idOf(di,gi,ii)]) done++;
    }));
    return {total,done};
  }
  function totals(){
    let total=0,done=0;
    PLAN.forEach((_,di)=>{const c=counts(di); total+=c.total; done+=c.done;});
    return {total,done};
  }

  /* --- Gün sekmeleri --- */
  const strip = document.getElementById("strip");
  PLAN.forEach((day,di)=>{
    const b = document.createElement("button");
    b.className = "daytab";
    b.type = "button";
    b.innerHTML = "<b>"+day.d+"</b><span>"+day.wd.slice(0,3)+"</span>";
    b.setAttribute("aria-label", day.d+" "+day.m+" — "+day.title);
    b.addEventListener("click", ()=>show(di));
    strip.appendChild(b);
  });

  let current = 0;

  function refreshTabs(){
    [...strip.children].forEach((b,di)=>{
      const c = counts(di);
      b.classList.toggle("on", di===current);
      b.classList.toggle("full", c.total>0 && c.done===c.total);
    });
    const t = totals();
    const pct = t.total ? Math.round(t.done/t.total*100) : 0;
    document.getElementById("allFill").style.width = pct+"%";
    document.getElementById("allTxt").textContent = t.done+" / "+t.total+" madde";
    document.getElementById("allPct").textContent = "%"+pct;
  }

  function refreshDay(){
    const c = counts(current);
    const pct = c.total ? Math.round(c.done/c.total*100) : 0;
    const fill = document.querySelector(".daymeter .fill");
    const lbl  = document.querySelector(".daymeter .lbl");
    if(fill) fill.style.width = pct+"%";
    if(lbl)  lbl.textContent = c.done+"/"+c.total;
    document.querySelector(".ticket").classList.toggle("done", c.total>0 && c.done===c.total);
    refreshTabs();
  }

  /* --- Pop-up Mantığı --- */
  const modal = document.getElementById("itemModal");
  const mTitle = document.getElementById("modalTitle");
  const mHint = document.getElementById("modalHint");
  const mTag = document.getElementById("modalTagWrap");
  const mBtn = document.getElementById("modalToggleBtn");
  let activeId = null;
  let activeEl = null;

  function openModal(id, itemData, el) {
    activeId = id;
    activeEl = el;
    mTitle.textContent = itemData.t;
    
    if(itemData.tag) {
      mTag.innerHTML = '<span class="tag '+itemData.tag+'">'+(itemData.tag==="krit"?"KRİTİK":"TASLAK")+'</span>';
      mTag.style.display = "block";
    } else {
      mTag.style.display = "none";
    }

    if(itemData.hint) {
      mHint.innerHTML = itemData.hint;
      mHint.style.display = "block";
    } else {
      mHint.style.display = "none";
    }

    updateModalBtn();
    modal.classList.add("show");
  }

  function updateModalBtn() {
    if(state[activeId]) {
      mBtn.textContent = "TAMAMLANDI (GERİ AL)";
      mBtn.classList.add("is-done");
    } else {
      mBtn.textContent = "TAMAMLA";
      mBtn.classList.remove("is-done");
    }
  }

  function closeModal() {
    modal.classList.remove("show");
  }

  mBtn.addEventListener("click", () => {
    state[activeId] = !state[activeId];
    if(!state[activeId]) delete state[activeId];
    activeEl.classList.toggle("on", !!state[activeId]);
    save();
    refreshDay();
    closeModal();
  });

  document.getElementById("modalCloseBtn").addEventListener("click", closeModal);
  modal.addEventListener("click", e => { if(e.target === modal) closeModal(); });

  /* --- Render --- */
  function show(di){
    current = di;
    const day = PLAN[di];
    let html = '<article class="ticket">';
    html += '<div class="stamp">TAMAMLANDI</div>';
    html += '<div class="ticket-head">';
    html +=   '<div class="stub"><span class="d">'+day.d+'</span><span class="m">'+day.m+'</span></div>';
    html +=   '<div class="head-body">';
    html +=     '<div class="eyebrow">'+day.wd+' · '+day.eyebrow+'</div>';
    html +=     '<h1 class="title">'+day.title+'</h1>';
    if(day.leg) html += '<div class="leg">'+day.leg+'</div>';
    html +=     '<div class="daymeter"><span class="lbl">0/0</span><span class="track"><span class="fill"></span></span></div>';
    html +=   '</div></div>';

    if(day.memo) html += '<div class="memo"><b>DİKKAT</b>'+day.memo+'</div>';

    day.groups.forEach((g,gi)=>{
      html += '<section class="group"><h2 class="group-h">'+g.h+'</h2>';
      g.items.forEach((raw,ii)=>{
        const it = norm(raw);
        const id = idOf(di,gi,ii);
        const on = state[id] ? " on" : "";
        
        html += '<div class="item'+on+'" role="button" tabindex="0" data-id="'+id+'" data-di="'+di+'" data-gi="'+gi+'" data-ii="'+ii+'">';
        html +=   '<span class="box"><svg viewBox="0 0 16 16"><polyline points="2.5,8.5 6.5,12.5 13.5,3.5"/></svg></span>';
        html +=   '<span class="txt">';
        if(it.tag) html += '<span class="tag '+it.tag+'">'+(it.tag==="krit"?"KRİTİK":"TASLAK")+'</span>';
        html +=     it.t;
        html +=   '</span></div>';
      });
      html += '</section>';
    });
    html += '</article>';
    document.getElementById("stage").innerHTML = html;

    document.querySelectorAll(".item").forEach(el=>{
      el.addEventListener("click", ()=>{
        const id = el.dataset.id;
        const it = norm(PLAN[el.dataset.di].groups[el.dataset.gi].items[el.dataset.ii]);
        openModal(id, it, el);
      });
    });

    refreshDay();
    const tab = strip.children[di];
    if(tab) tab.scrollIntoView({block:"nearest", inline:"center", behavior:"smooth"});
  }

  /* --- Yedekleme ve Güncelleme Butonu --- */
  document.getElementById("btnExport").addEventListener("click", ()=>{
    const blob = new Blob([JSON.stringify({v:1, key:KEY, state}, null, 2)], {type:"application/json"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "gezi-ilerleme.json";
    a.click();
    URL.revokeObjectURL(a.href);
  });
  document.getElementById("btnImport").addEventListener("click", ()=>document.getElementById("fileIn").click());
  document.getElementById("fileIn").addEventListener("change", e=>{
    const f = e.target.files[0]; if(!f) return;
    const r = new FileReader();
    r.onload = () => {
      try{
        const data = JSON.parse(r.result);
        state = data.state || {};
        save(); show(current);
      }catch(err){
        alert("Dosya okunamadı.");
      }
    };
    r.readAsText(f);
    e.target.value = "";
  });
  
  document.getElementById("btnRefresh").addEventListener("click", ()=>{
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(registrations => {
        for(let reg of registrations) { reg.unregister(); }
        window.location.reload(true);
      });
    } else {
      window.location.reload(true);
    }
  });

  document.getElementById("btnReset").addEventListener("click", ()=>{
    if(!confirm("Tüm işaretlemeler silinecek. Devam?")) return;
    state = {}; save(); show(current);
  });

  /* --- Başlangıç --- */
  load();
  const today = new Date();
  let start = 0;
  if(today.getFullYear()===2026 && today.getMonth()===7){
    const dd = today.getDate();
    for(let i=0;i<PLAN.length;i++){ if(parseInt(PLAN[i].d,10) <= dd) start = i; }
  }
  show(start);
})();
</script>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/avrupa_gezi_rehberi/sw.js')
        .catch(err => console.log('Service Worker hatası:', err));
    });
  }
</script>
</body>
